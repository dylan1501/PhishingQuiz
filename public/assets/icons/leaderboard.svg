<svg width="64" height="64" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- First place (middle, tallest) -->
  <rect x="384" y="384" width="256" height="448" rx="32" fill="#FFD700"/>
  <!-- Second place (left) -->
  <rect x="128" y="544" width="192" height="288" rx="32" fill="#C0C0C0"/>
  <!-- Third place (right) -->
  <rect x="704" y="672" width="192" height="160" rx="32" fill="#CD7F32"/>
  <!-- Medals on top -->
  <circle cx="512" cy="320" r="48" fill="#FFD700"/>
  <circle cx="224" cy="480" r="40" fill="#C0C0C0"/>
  <circle cx="800" cy="608" r="40" fill="#CD7F32"/>
  <!-- Numbers -->
  <text x="512" y="360" font-size="96" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="224" y="520" font-size="80" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="800" y="648" font-size="80" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="middle">3</text>
</svg>